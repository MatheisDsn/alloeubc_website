{% extends "index/base.html" %}
{% block title %}Annonce supprimée{% endblock %}
{% block contain %}
<section class="py-12">
  <div class="container mx-auto px-4 max-w-2xl">
    <div class="bg-white border rounded-xl p-6 shadow-sm">
      <h1 class="text-2xl font-bold mb-2">Annonce supprimée</h1>
      <p class="text-secondary-700">Votre annonce « {{ title }} » liée à l'e-mail <strong>{{ email }}</strong> a été supprimée.</p>
      <div class="mt-4">
        <a href="{% url 'annonces:list' %}" class="text-primary-700 underline">Retour aux annonces</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
